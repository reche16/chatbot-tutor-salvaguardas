{% extends "base.html" %}
{% block titulo %}Entrar · Chatbot Tutor{% endblock %}
{% block conteudo %}
<div class="cartao login">
  <h1>Entrar</h1>
  {% if form.errors %}<p class="flash-erro" role="alert">E-mail ou senha incorretos.</p>{% endif %}
  <form method="post">{% csrf_token %}
    <div class="campo"><label for="id_username">E-mail institucional</label>
    <input type="email" name="username" id="id_username" autocomplete="username" required autofocus value="{{ form.username.value|default_if_none:'' }}"></div>
    <div class="campo"><label for="id_password">Senha</label>
    <input type="password" name="password" id="id_password" autocomplete="current-password" required></div>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Entrar</button>
  </form>
  <p class="suave rodape-conta"><a href="{% url 'password_reset' %}">Esqueci minha senha</a> · <a href="{% url 'cadastro' %}">Criar conta de aluno</a></p>
</div>
{% endblock %}
